<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graywind — Live Status</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root{
  --bg-0:#0e0e10;
  --bg-1:#16161a;
  --bg-2:#1d1d22;
  --bg-3:#26262d;
  --line:#2e2e36;
  --gold:#d4af6a;
  --gold-soft:#c9b489;
  --gold-dim:#8a7c5c;
  --gold-bright:#f0d9a8;
  --txt:#e9e4d8;
  --txt-2:#a8a294;
  --txt-3:#6f6a5e;
  --pos:#7bbf8e;
  --neg:#e0654f;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-0);
  color: var(--txt);
  padding: clamp(16px,4vw,32px);
  max-width: 1000px;
  margin: 0 auto;
}
.top-bar {
  padding-bottom: clamp(10px,2vw,16px);
  margin-bottom: clamp(16px,3vw,24px);
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg,var(--bg-1),var(--bg-0));
}
.top-bar h1 {
  font-size: clamp(18px,3vw,24px);
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--gold);
  text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}
h2 {
  font-size: clamp(13px,2vw,15px);
  font-weight: 600;
  color: var(--gold-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: clamp(20px,4vw,32px) 0 10px;
}
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.metric-cell { background: var(--bg-1); padding: clamp(10px,2vw,14px); }
.metric-label { font-size: 10px; color: var(--gold-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
.metric-val { font-size: clamp(15px,2.5vw,19px); font-weight: 600; color: var(--txt); font-variant-numeric: tabular-nums; }
.metric-val.pos { color: var(--pos); }
.metric-val.neg { color: var(--neg); }
table { width: 100%; border-collapse: collapse; background: var(--bg-1); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
th, td { text-align: left; padding: clamp(6px,1.5vw,9px) clamp(8px,2vw,12px); border-bottom: 1px solid var(--line); font-size: clamp(11px,1.8vw,13px); }
th { color: var(--gold-dim); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.06em; background: var(--bg-2); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg-2); }
.pnl-positive { color: var(--pos); }
.pnl-negative { color: var(--neg); }
#chart-wrap { background: var(--bg-1); border: 1px solid var(--line); border-radius: 8px; padding: clamp(8px,2vw,12px); }
#chart { width: 100%; height: 320px; display: block; }
.line { fill: none; stroke: var(--gold); stroke-width: 2; }
.axis path, .axis line { stroke: var(--line); }
.axis text { fill: var(--txt-3); font-size: 11px; }
#trade-log { max-height: 360px; overflow-y: auto; border-radius: 8px; }
#status-panel p { color: var(--txt-2); font-size: clamp(11px,1.8vw,12px); margin-bottom: 12px; }
</style>
</head>
<body>
<div class="top-bar"><h1>Graywind — Live Status</h1></div>
<div id="status-panel"></div>
<h2>Equity Curve</h2>
<div id="chart-wrap"><svg id="chart"></svg></div>
<h2>Trade Log</h2>
<div id="trade-log"><table id="trade-table"><thead>
  <tr><th>Timestamp</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th><th>Reason</th></tr>
</thead><tbody></tbody></table></div>

<script>
function parseCSV(text) {
  // Split on \r?\n and trim each value -- Python's csv module writes \r\n
  // line endings by default, and this parser used to split on "\n" only,
  // leaving a trailing "\r" on every row's last field. That silently broke
  // status.csv's "reason" column (row.reason was undefined) and permanently
  // killed the equity chart on the first blank-equity row (parseFloat("\r")
  // is NaN). Caught in final review, fixed here.
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(",").map(h => h.trim());
  return lines.slice(1).filter(l => l.length > 0).map(line => {
    const values = line.split(",").map(v => v.trim());
    const row = {};
    headers.forEach((h, i) => { row[h] = values[i]; });
    return row;
  });
}

async function loadCSV(path) {
  const res = await fetch(path);
  const text = await res.text();
  return parseCSV(text);
}

function renderStatus(statusRows) {
  const panel = document.getElementById("status-panel");
  if (statusRows.length === 0) { panel.textContent = "No status data yet."; return; }
  const first = statusRows[0];
  const pnl = parseFloat(first.today_pnl);
  const pnlClass = pnl > 0 ? "pos" : (pnl < 0 ? "neg" : "");
  let html = `<p>Last cycle: ${first.last_cycle_timestamp}</p>`;
  html += `<div class="metrics-grid">`
    + `<div class="metric-cell"><div class="metric-label">Equity</div><div class="metric-val">$${first.account_equity}</div></div>`
    + `<div class="metric-cell"><div class="metric-label">Today's P&amp;L</div><div class="metric-val ${pnlClass}">$${first.today_pnl}</div></div>`
    + `</div>`;
  html += "<table style=\"margin-top:12px\"><thead><tr><th>Symbol</th><th>Position</th><th>Action</th><th>Reason</th></tr></thead><tbody>";
  for (const row of statusRows) {
    const position = row.position_open === "True" ? `${row.shares} sh @ $${row.entry_price}` : "flat";
    html += `<tr><td>${row.symbol}</td><td>${position}</td><td>${row.action}</td><td>${row.reason}</td></tr>`;
  }
  html += "</tbody></table>";
  panel.innerHTML = html;
}

function renderTradeLog(tradeRows) {
  const tbody = document.querySelector("#trade-table tbody");
  tbody.innerHTML = "";
  for (const row of tradeRows.slice().reverse()) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${row.timestamp}</td><td>${row.symbol}</td><td>${row.side}</td>`
      + `<td>${row.qty}</td><td>${row.price}</td><td>${row.reason}</td>`;
    tbody.appendChild(tr);
  }
}

function renderEquityCurve(equityRows) {
  const svg = d3.select("#chart");
  const width = svg.node().clientWidth || 800;
  const height = 320;
  const margin = { top: 16, right: 16, bottom: 32, left: 64 };
  svg.attr("viewBox", `0 0 ${width} ${height}`);

  if (equityRows.length === 0) return;

  const data = equityRows
    .filter(r => r.equity !== "")
    .map(r => ({ time: new Date(r.timestamp), equity: parseFloat(r.equity) }));

  const x = d3.scaleTime()
    .domain(d3.extent(data, d => d.time))
    .range([margin.left, width - margin.right]);
  const y = d3.scaleLinear()
    .domain([d3.min(data, d => d.equity) * 0.98, d3.max(data, d => d.equity) * 1.02])
    .range([height - margin.bottom, margin.top]);

  const line = d3.line().x(d => x(d.time)).y(d => y(d.equity));

  svg.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${height - margin.bottom})`)
    .call(d3.axisBottom(x));
  svg.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(y));
  svg.append("path").datum(data).attr("class", "line").attr("d", line);
}

async function main() {
  const [equityRows, tradeRows, statusRows] = await Promise.all([
    loadCSV("dashboard-data/equity_curve.csv"),
    loadCSV("dashboard-data/trade_log.csv"),
    loadCSV("dashboard-data/status.csv"),
  ]);
  renderStatus(statusRows);
  renderTradeLog(tradeRows);
  renderEquityCurve(equityRows);
}

main();
</script>
</body>
</html>
