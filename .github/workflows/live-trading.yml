name: Graywind Live Trading Cycle

# Every 30 minutes during regular US market hours, at :07/:37 rather than a
# round number. GitHub's own docs warn that scheduled workflows "may be
# delayed during periods of high load... high load times include the start
# of every hour" -- every other public repo's */15 or */30 or hourly cron
# also fires at :00/:15/:30/:45, so those exact moments are the most
# congested. Verified empirically here: this workflow ran close to its
# configured */15 cadence (10-13 firings/day) through 2026-08-25, then
# collapsed to 1-3 firings/day from 2026-08-26 onward -- individual runs
# still complete in ~60-90s (not a backlog from job duration), so the drop
# is GitHub silently not creating the scheduled run at all, not this repo's
# workflow being slow. Widening to 30 min plus the offset is the first,
# free mitigation to try before reaching for an external trigger (see
# docs/superpowers/plans/2026-09-03-graywind-external-cron-trigger.md if
# this alone doesn't recover the cadence).
#
# GitHub cron is UTC only (no daylight-saving handling) -- 13:30-20:00 UTC
# covers 9:30am-4:00pm ET during EDT (summer); during EST (winter) this
# fires roughly 30-60 minutes late/early relative to the real market
# open/close on the edges of the window, which is acceptable
# (is_market_hours() in live_loop.py itself checks real ET market hours and
# exits immediately outside them, so an extra early/late firing is a
# no-op, not a bug). workflow_dispatch lets this be run by hand for the
# Task 7 dry run.
on:
  schedule:
    - cron: "7,37 13-20 * * 1-5"
  workflow_dispatch:

# Lets the built-in GITHUB_TOKEN push graywind's own state/*.csv and
# dashboard-data/*.csv commit and manage the pipeline-alarm issue. No PAT
# needed -- state and dashboard data live in this same repo, so the default
# token already has everything this workflow pushes to.
permissions:
  contents: write
  issues: write

# Scheduled runs can be delayed under load, and a manual workflow_dispatch
# can overlap a scheduled run -- without this, an overlapping run would
# check out a now-stale HEAD and its git push would be rejected as a
# non-fast-forward. Queue overlapping runs instead of racing them.
concurrency:
  group: live-cycle
  cancel-in-progress: false

jobs:
  live-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out graywind
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the live trading cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 live_loop.py

      # Seeds tier_pools.csv with real starting cash the first time it's found
      # entirely at $0 (see scripts/seed_tier_pools.py's module docstring for
      # why this is needed -- the pool-scoped sizing code shipped without any
      # step that ever funded the pools it sizes against). Idempotent: once
      # seeded, this becomes a pure health check on every later run. Runs
      # regardless of market hours (always()) so a real cash split lands as
      # soon as possible rather than waiting for the next market-hours cycle.
      - name: Seed or check tier pool funding
        id: tier_pools
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python3 scripts/seed_tier_pools.py

      - name: Check whether this cycle actually ran
        # An out-of-market-hours cron firing (GitHub cron is UTC-only and
        # can't track DST, so it fires several times/day outside
        # is_market_hours()) makes main() return before dashboard_export/
        # is ever written. Detect that here so the merge step below can
        # skip cleanly instead of failing on a missing directory. always()
        # so this still runs (and reports ran=false) even if the trading
        # cycle step itself failed.
        id: cycle
        if: always()
        run: |
          if [ -d dashboard_export ]; then echo "ran=true" >> "$GITHUB_OUTPUT"; else echo "ran=false" >> "$GITHUB_OUTPUT"; fi

      - name: Merge this cycle's export into dashboard-data
        # Skipped on an out-of-market-hours firing where dashboard_export/
        # was never written -- otherwise this raises FileNotFoundError and
        # fails the job on every such firing.
        if: always() && steps.cycle.outputs.ran == 'true'
        run: python3 merge_dashboard_export.py dashboard_export dashboard-data

      - name: Commit and push state + dashboard data
        # if: always() -- state/*.csv and dashboard-data/*.csv are written
        # before any non-zero exit (state by main()'s finally block;
        # dashboard-data by the merge step above, itself gated on always()),
        # so a failed cycle still leaves a status row that must be committed
        # rather than silently discarded under the default if: success().
        # One repo, one push -- no PAT, no second remote to fail against.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Two separate `git add` calls, not one `git add -A state dashboard-data`:
          # git add with multiple pathspecs is atomic -- if either directory doesn't
          # exist on disk (state/ won't, until the very first successful run creates
          # it), the WHOLE call fails and stages NEITHER, silently discarding a real
          # dashboard-data update alongside the missing-state failure. Caught in code
          # review before the first real deploy, reproduced directly.
          git add -A state 2>/dev/null || true
          git add -A dashboard-data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes this cycle; nothing to commit."
          else
            git commit -m "Update live state and dashboard data for $(date -u +%FT%H:%M)"
            git push
          fi

      # The macro gate fails closed: when the upstream Bullion data.json can't be
      # read or is past its staleness ceiling, decide_trade blocks every entry.
      # That looks identical to a healthy risk-off market from the outside -- cron
      # green, no pipeline-alarm, equity flat -- so it gets its own alarm.
      #
      # Deliberately a SEPARATE label from pipeline-alarm: the "Close the alarm
      # issue on success" step below closes every open pipeline-alarm issue, which
      # would auto-close this one on the next green cycle. And the check never
      # fails the job, because live-cycle-small declares `needs: live-cycle` and
      # would be skipped along with it.
      # Only on the main job -- macro data is account-independent, so running it
      # in live-cycle-small too would just open duplicate issues.
      - name: Check macro-gate health
        id: macro_health
        if: success()
        run: python scripts/check_macro_health.py

      - name: Ensure the macro-alarm label exists
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'macro-alarm',
                color: 'fbca04',
                description: 'Macro gate cannot read its upstream feed; new entries are blocked',
              });
            } catch (err) {
              if (err.status !== 422) throw err; // 422 = label already exists
            }

      - name: Raise or clear the macro alarm
        if: success()
        uses: actions/github-script@v7
        env:
          MACRO_HEALTH: ${{ steps.macro_health.outputs.macro_health }}
          MACRO_STREAK: ${{ steps.macro_health.outputs.macro_streak }}
        with:
          script: |
            const unhealthy = process.env.MACRO_HEALTH === 'unhealthy';
            const streak = process.env.MACRO_STREAK;
            const now = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'macro-alarm',
            });

            if (!unhealthy) {
              for (const issue of issues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Recovered — the macro gate answered again at ${now}.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
              return;
            }

            const body = [
              `**${now}** — the macro gate has been unavailable for **${streak} consecutive cycles**.`,
              '',
              'The macro gate fails closed, so **no new entries are being opened on any symbol**.',
              'This is not a risk-off signal — the gate cannot answer at all.',
              '',
              'Most likely cause: the upstream Bullion `data.json` has stopped updating',
              '(its own cron failing, an unset secret, a repo rename, or Pages disabled).',
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Macro gate unavailable — new entries are blocked',
                body,
                labels: ['macro-alarm'],
                assignees: [context.repo.owner],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }

      # Same rationale as the macro-alarm above: a $0 tier pool degrades to
      # "position size rounds to zero shares" / frozen tier-1 drift, which
      # looks identical to a healthy quiet cycle from the outside. Separate
      # label for the same reason macro-alarm is separate -- the generic
      # "Close the alarm issue on success" step below would otherwise
      # auto-close it on the next green cycle regardless of whether the
      # pools actually got seeded.
      - name: Ensure the tier-pool-alarm label exists
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'tier-pool-alarm',
                color: 'fbca04',
                description: 'A tier pool is unfunded and could not be seeded',
              });
            } catch (err) {
              if (err.status !== 422) throw err; // 422 = label already exists
            }

      - name: Raise or clear the tier-pool alarm (main account)
        if: success()
        uses: actions/github-script@v7
        env:
          TIER_POOL_HEALTH: ${{ steps.tier_pools.outputs.tier_pool_health }}
        with:
          script: |
            const unhealthy = process.env.TIER_POOL_HEALTH === 'unhealthy';
            const now = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '(main account)';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tier-pool-alarm',
            });
            const mine = issues.filter(i => i.body && i.body.includes(marker));

            if (!unhealthy) {
              for (const issue of mine) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Recovered ${marker} — tier pools funded (or already were) as of ${now}.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
              return;
            }

            const body = [
              `**${now}** ${marker} — a tier pool is unfunded and could not be seeded this cycle.`,
              '',
              'This blocks new entries for that tier (sizes to zero shares) or freezes tier-1\'s',
              'monthly rebalance at its current holding, without failing the workflow.',
              '',
              'Most likely cause: ALPACA_API_KEY/ALPACA_API_SECRET missing or invalid, or a',
              'transient Alpaca API error. See scripts/seed_tier_pools.py.',
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            if (mine.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Tier pool unfunded ${marker}`,
                body,
                labels: ['tier-pool-alarm'],
                assignees: [context.repo.owner],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: mine[0].number,
                body,
              });
            }

      - name: Ensure the pipeline-alarm label exists
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'pipeline-alarm',
                color: 'd93f0b',
                description: 'Live trading cycle workflow is failing',
              });
            } catch (err) {
              if (err.status !== 422) throw err; // 422 = label already exists
            }

      - name: Report failure to the alarm issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: jobsResponse } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failedStep = jobsResponse.jobs
              .flatMap(j => j.steps || [])
              .find(s => s.conclusion === 'failure');
            const stepName = failedStep ? failedStep.name : 'unknown step';
            const now = new Date().toISOString();
            const body = `**${now}** — failing step: **${stepName}**\nRun: ${runUrl}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-alarm',
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Live trading cycle is failing',
                body,
                labels: ['pipeline-alarm'],
                assignees: [context.repo.owner],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }

      - name: Close the alarm issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-alarm',
            });
            const now = new Date().toISOString();
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered — the run at ${now} succeeded.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

  live-cycle-small:
    needs: live-cycle
    runs-on: ubuntu-latest
    steps:
      - name: Check out graywind
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the live trading cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_SMALL }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET_SMALL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GRAYWIND_STATE_DIR: state/small
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GRAYWIND_DASHBOARD_DIR: dashboard-data/small
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 live_loop.py

      - name: Seed or check tier pool funding
        id: tier_pools
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_SMALL }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET_SMALL }}
          GRAYWIND_STATE_DIR: state/small
        run: python3 scripts/seed_tier_pools.py

      - name: Check whether this cycle actually ran
        id: cycle
        if: always()
        run: |
          if [ -d dashboard_export ]; then echo "ran=true" >> "$GITHUB_OUTPUT"; else echo "ran=false" >> "$GITHUB_OUTPUT"; fi

      - name: Merge this cycle's export into dashboard-data/small
        if: always() && steps.cycle.outputs.ran == 'true'
        run: python3 merge_dashboard_export.py dashboard_export dashboard-data/small

      - name: Commit and push state + dashboard data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state 2>/dev/null || true
          git add -A dashboard-data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes this cycle; nothing to commit."
          else
            git commit -m "Update live state and dashboard data (small account) for $(date -u +%FT%H:%M)"
            git fetch origin main
            git rebase origin/main
            git push
          fi

      # Label already ensured by the main job (this job `needs: live-cycle`, so it
      # always runs after). Same rationale/separate-label reasoning as the main
      # job's tier-pool-alarm step above -- see its comment.
      - name: Raise or clear the tier-pool alarm (small account)
        if: success()
        uses: actions/github-script@v7
        env:
          TIER_POOL_HEALTH: ${{ steps.tier_pools.outputs.tier_pool_health }}
        with:
          script: |
            const unhealthy = process.env.TIER_POOL_HEALTH === 'unhealthy';
            const now = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '(small account)';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tier-pool-alarm',
            });
            const mine = issues.filter(i => i.body && i.body.includes(marker));

            if (!unhealthy) {
              for (const issue of mine) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Recovered ${marker} — tier pools funded (or already were) as of ${now}.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
              return;
            }

            const body = [
              `**${now}** ${marker} — a tier pool is unfunded and could not be seeded this cycle.`,
              '',
              'This blocks new entries for that tier (sizes to zero shares) or freezes tier-1\'s',
              'monthly rebalance at its current holding, without failing the workflow.',
              '',
              'Most likely cause: ALPACA_API_KEY_SMALL/ALPACA_API_SECRET_SMALL missing or invalid,',
              'or a transient Alpaca API error. See scripts/seed_tier_pools.py.',
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            if (mine.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Tier pool unfunded ${marker}`,
                body,
                labels: ['tier-pool-alarm'],
                assignees: [context.repo.owner],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: mine[0].number,
                body,
              });
            }

      - name: Report failure to the alarm issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: jobsResponse } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failedStep = jobsResponse.jobs
              .flatMap(j => j.steps || [])
              .find(s => s.conclusion === 'failure');
            const stepName = failedStep ? failedStep.name : 'unknown step';
            const now = new Date().toISOString();
            const body = `**${now}** — failing step: **${stepName}** (small account)\nRun: ${runUrl}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-alarm',
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Live trading cycle is failing',
                body,
                labels: ['pipeline-alarm'],
                assignees: [context.repo.owner],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }
